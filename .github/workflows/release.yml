name: release

# Triggered by scripts/release pushing a vX.Y.Z tag.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check tag matches package versions
        run: |
          for d in backend toolkit; do
            version=$(cd "$d" && uv version --short)
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "$d version $version does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Install dependencies
        run: scripts/bootstrap

      - name: Build static files
        run: scripts/build

      - name: Build packages
        run: |
          uv build --no-sources backend --out-dir dist
          uv build --no-sources toolkit --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish dist/*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # needed to find the previous tag

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare against the previous tag, not the last GitHub release, so the notes
          # don't span releases that never got a GitHub release.
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --notes-start-tag "$previous"
