[project]
name = "sim-atlas"
version = "0.0.19"
description = "Search and discovery platform for simulation nodes — Python functions and workflow definitions used in scientific computing."
authors = [
  { name = "Sebastian Eibl", email = "sebastian.eibl@mpcdf.mpg.de"},
]
maintainers = [
  { name = "Sebastian Eibl", email = "sebastian.eibl@mpcdf.mpg.de"},
]
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
keywords = ["pyiron"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=4.0.0",
    "fastapi[standard]>=0.122.0",
    "numpy>=1.26.0; python_version < '3.13'",
    "numpy>=2.1.0; python_version == '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    "pydantic-settings[toml]>=2.13.1",
    "pyjwt>=2.12.1",
    "sim-atlas-models==0.0.19",
    "tqdm>=4.67.3",
]

# One extra per embedding provider (semantic search). Install the one you use,
# e.g. `sim-atlas[fastembed]`; without any, search is keyword-only.
[project.optional-dependencies]
fastembed = [
    "fastembed>=0.4.0; python_version < '3.13'",
    "fastembed>=0.6.0; python_version >= '3.13'",
    "huggingface-hub>=0.20",
]
openai = ["openai>=2.8.1"]
voyageai = ["voyageai>=0.3.7"]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "ruff>=0.14.6",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project.scripts]
sim-atlas-access-token = "sim_atlas.cli:token"
sim-atlas = "sim_atlas.cli:backend"

[tool.fastapi]
entrypoint = "sim_atlas.main:app"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-comprehensions
    "C4",
    # eradicate
    "ERA",
    # pylint
    "PL",
]
ignore = [
    "E501",  # line too long
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[pytest]
strict = true

[tool.uv.sources]
sim-atlas-models = { path = "../models", editable = true }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
