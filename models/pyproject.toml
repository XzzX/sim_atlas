[project]
name = "sim-atlas-models"
version = "0.0.19"
description = "Shared wire models (Pydantic) of the Simulation Atlas REST API, used by the sim-atlas backend and toolkit"
authors = [
  { name = "Sebastian Eibl", email = "sebastian.eibl@mpcdf.mpg.de"},
]
maintainers = [
  { name = "Sebastian Eibl", email = "sebastian.eibl@mpcdf.mpg.de"},
]
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
keywords = ["pyiron"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.5.0; python_version < '3.13'",
    "pydantic>=2.8.0; python_version == '3.13'",
    "pydantic>=2.12.0; python_version >= '3.14'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.407",
    "ruff>=0.14.6",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-comprehensions
    "C4",
    # eradicate
    "ERA",
    # pylint
    "PL",
]
ignore = [
    "E501",  # line too long
    "PLR0917", # Too many positional arguments
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
